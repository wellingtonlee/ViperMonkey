[tool.ruff]
target-version = "py36"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter, not enforced in legacy code)
    "E741",   # ambiguous variable name (common in math/parsing code)
    "F841",   # local variable assigned but never used (many in legacy code)
    "B007",   # unused loop variable (common pattern in this codebase)
    "B023",   # function uses loop variable (common in pyparsing callbacks)
    "UP031",  # printf-style formatting (too many to change at once)
    "SIM105", # use contextlib.suppress (stylistic preference)
    "RUF005", # consider iterable unpacking (stylistic)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"vipermonkey/core/vba_constants.py" = ["E", "W", "F", "UP", "RUF"]  # auto-generated constants

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
